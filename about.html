<!DOCTYPE html>
<html lang="ko"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>소개</title>
    <!-- Font Awesome & Google Fonts -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;600;700&amp;display=swap" rel="stylesheet">
    <style>
        /* Base Variables & Theme */
        :root {
            --bg-gradient-dark: linear-gradient(135deg, #0b0d19 0%, #171b36 50%, #0d122b 100%);
            --text-dark: #f1f5f9;
            --text-sub-dark: #94a3b8;
            --card-bg-dark: rgba(23, 27, 54, 0.7);
            --card-border-dark: rgba(255, 255, 255, 0.12);
            --shadow-dark: 0 8px 32px 0 rgba(0, 0, 0, 0.37);

            --bg-gradient-light: linear-gradient(135deg, #eef2ff 0%, #e0e7ff 50%, #f3e8ff 100%);
            --text-light: #1e1b4b;
            --text-sub-light: #475569;
            --card-bg-light: rgba(255, 255, 255, 0.75);
            --card-border-light: rgba(99, 102, 241, 0.2);
            --shadow-light: 0 8px 32px 0 rgba(99, 102, 241, 0.15);

            --accent-pink: #ff6b9d;
            --accent-cyan: #4deeea;
            --accent-glow: #8a74f9;
            --transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        body[data-theme="dark"] {
            --bg-color: var(--bg-gradient-dark);
            --text-main: var(--text-dark);
            --text-sub: var(--text-sub-dark);
            --card-bg: var(--card-bg-dark);
            --card-border: var(--card-border-dark);
            --shadow: var(--shadow-dark);
        }

        body[data-theme="light"] {
            --bg-color: var(--bg-gradient-light);
            --text-main: var(--text-light);
            --text-sub: var(--text-sub-light);
            --card-bg: var(--card-bg-light);
            --card-border: var(--card-border-light);
            --shadow: var(--shadow-light);
        }

        /* Global Styles */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Noto Sans KR', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            overflow-x: hidden;
            transition: background 0.5s ease;
            position: relative;
        }

        /* Canvas Background */
        #space-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        /* Container & Layout */
        .container {
            position: relative;
            z-index: 1;
            max-width: 800px;
            margin: 0 auto;
            padding: 1.5rem 1rem 4rem 1rem;
            display: flex;
            flex-direction: column;
            gap: 2.2rem;
        }

        /* Header Navigation */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.5rem 0;
        }

        .logo-title {
            font-size: 1.4rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            background: linear-gradient(135deg, var(--accent-cyan), var(--accent-pink));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .theme-btn {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            color: var(--text-main);
            padding: 0.55rem 1rem;
            border-radius: 50px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            font-size: 0.95rem;
            font-weight: 600;
            box-shadow: var(--shadow);
            transition: var(--transition);
            backdrop-filter: blur(10px);
        }

        .theme-btn:hover {
            transform: scale(1.05);
        }

        /* Hero Intro Section */
        .hero {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--card-border);
            border-radius: 24px;
            padding: 2.5rem 1.5rem;
            text-align: center;
            box-shadow: var(--shadow);
            position: relative;
            overflow: hidden;
        }

        .nickname-badge {
            display: inline-block;
            padding: 0.4rem 1.2rem;
            background: rgba(138, 116, 249, 0.2);
            border: 1px solid var(--accent-glow);
            border-radius: 50px;
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--accent-cyan);
            margin-bottom: 1rem;
        }

        .hero h1 {
            font-size: 2.1rem;
            font-weight: 700;
            margin-bottom: 0.8rem;
            line-height: 1.3;
            word-break: keep-all;
        }

        .hero p {
            font-size: 1.05rem;
            color: var(--text-sub);
            word-break: keep-all;
            line-height: 1.6;
        }

        /* Visitor Welcome Box */
        .welcome-box {
            margin-top: 1.8rem;
            padding-top: 1.5rem;
            border-top: 1px dashed var(--card-border);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.8rem;
        }

        .welcome-input-group {
            display: flex;
            gap: 0.5rem;
            width: 100%;
            max-width: 380px;
        }

        .welcome-input {
            flex: 1;
            padding: 0.7rem 1rem;
            border-radius: 14px;
            border: 1px solid var(--card-border);
            background: rgba(255, 255, 255, 0.08);
            color: var(--text-main);
            font-size: 0.95rem;
            outline: none;
            transition: var(--transition);
        }

        body[data-theme="light"] .welcome-input {
            background: rgba(255, 255, 255, 0.9);
        }

        .welcome-input:focus {
            border-color: var(--accent-cyan);
            box-shadow: 0 0 12px rgba(77, 238, 234, 0.25);
        }

        .welcome-btn {
            padding: 0.7rem 1.2rem;
            border-radius: 14px;
            border: none;
            background: linear-gradient(135deg, var(--accent-cyan), var(--accent-glow));
            color: #fff;
            font-weight: 700;
            font-size: 0.95rem;
            cursor: pointer;
            transition: var(--transition);
            white-space: nowrap;
        }

        .welcome-btn:hover {
            transform: scale(1.04);
            box-shadow: 0 4px 15px rgba(138, 116, 249, 0.4);
        }

        .welcome-greeting {
            font-size: 1.05rem;
            font-weight: 600;
            color: var(--accent-pink);
            min-height: 1.5em;
            animation: fadeIn 0.4s ease;
        }

        /* Titles */
        .section-title {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 1.2rem;
            display: flex;
            align-items: center;
            gap: 0.6rem;
        }

        /* Flip Cards Section */
        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
            gap: 1.5rem;
            perspective: 1000px;
        }

        .flip-card {
            background-color: transparent;
            height: 220px;
            cursor: pointer;
        }

        .flip-card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            text-align: center;
            transition: transform 0.7s cubic-bezier(0.4, 0.2, 0.2, 1);
            transform-style: preserve-3d;
        }

        .flip-card.flipped .flip-card-inner {
            transform: rotateY(180deg);
        }

        .card-front, .card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            -webkit-backface-visibility: hidden;
            backface-visibility: hidden;
            border-radius: 20px;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border: 1px solid var(--card-border);
            box-shadow: var(--shadow);
            background: var(--card-bg);
            backdrop-filter: blur(10px);
        }

        .card-front i {
            font-size: 2.8rem;
            margin-bottom: 1rem;
            background: linear-gradient(135deg, var(--accent-cyan), var(--accent-glow));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .card-front h3 {
            font-size: 1.3rem;
            font-weight: 700;
            margin-bottom: 0.4rem;
        }

        .card-front p {
            font-size: 0.9rem;
            color: var(--text-sub);
        }

        .card-back {
            transform: rotateY(180deg);
            background: linear-gradient(135deg, rgba(138, 116, 249, 0.25), rgba(11, 13, 25, 0.95));
            border-color: var(--accent-glow);
            color: #f8fafc;
        }

        body[data-theme="light"] .card-back {
            background: linear-gradient(135deg, rgba(138, 116, 249, 0.9), rgba(99, 102, 241, 0.95));
            color: #ffffff;
        }

        .card-back h4 {
            font-size: 1.15rem;
            font-weight: 700;
            color: var(--accent-cyan);
            margin-bottom: 0.6rem;
        }

        .card-back p {
            font-size: 0.95rem;
            line-height: 1.5;
            word-break: keep-all;
        }

        /* OX Quiz Section */
        .quiz-card {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--card-border);
            border-radius: 24px;
            padding: 2rem 1.5rem;
            text-align: center;
            box-shadow: var(--shadow);
            position: relative;
        }

        .quiz-question {
            font-size: 1.6rem;
            font-weight: 700;
            margin: 1rem 0 1.5rem 0;
            word-break: keep-all;
        }

        .quiz-btns {
            display: flex;
            justify-content: center;
            gap: 1.5rem;
        }

        .ox-btn {
            width: 75px;
            height: 75px;
            border-radius: 50%;
            border: 2px solid var(--card-border);
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-main);
            font-size: 2rem;
            font-weight: 700;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .ox-btn.o-btn:hover {
            border-color: #4ade80;
            background: rgba(74, 222, 128, 0.2);
            color: #4ade80;
            transform: scale(1.1);
            box-shadow: 0 0 20px rgba(74, 222, 128, 0.4);
        }

        .ox-btn.x-btn:hover {
            border-color: #f87171;
            background: rgba(248, 113, 113, 0.2);
            color: #f87171;
            transform: scale(1.1);
            box-shadow: 0 0 20px rgba(248, 113, 113, 0.4);
        }

        .quiz-result {
            margin-top: 1.5rem;
            font-size: 1.1rem;
            font-weight: 600;
            min-height: 1.8em;
            transition: all 0.3s ease;
        }

        /* Shake effect for wrong answer */
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-10px); }
            40%, 80% { transform: translateX(10px); }
        }
        .shake {
            animation: shake 0.5s ease-in-out;
        }

        /* Celebrate pulse effect for right answer */
        @keyframes celebratePulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.03); box-shadow: 0 0 30px rgba(74, 222, 128, 0.5); }
            100% { transform: scale(1); }
        }
        .celebrate {
            animation: celebratePulse 0.6s ease-in-out;
        }

        /* Fortune Wheel/Button Section */
        .fortune-card {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--card-border);
            border-radius: 24px;
            padding: 2rem 1.5rem;
            text-align: center;
            box-shadow: var(--shadow);
        }

        .fortune-btn {
            padding: 0.9rem 2rem;
            font-size: 1.1rem;
            font-weight: 600;
            border-radius: 50px;
            border: none;
            background: linear-gradient(135deg, var(--accent-pink), var(--accent-glow));
            color: white;
            cursor: pointer;
            box-shadow: 0 5px 20px rgba(255, 107, 157, 0.4);
            transition: var(--transition);
            display: inline-flex;
            align-items: center;
            gap: 0.6rem;
            margin-bottom: 1.5rem;
        }

        .fortune-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 25px rgba(255, 107, 157, 0.6);
        }

        .fortune-btn:active {
            transform: scale(0.98);
        }

        .fortune-display {
            min-height: 90px;
            padding: 1.2rem;
            border-radius: 16px;
            background: rgba(0, 0, 0, 0.15);
            border: 1px dashed var(--card-border);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
            line-height: 1.6;
            color: var(--text-main);
            word-break: keep-all;
            transition: all 0.3s ease;
        }

        body[data-theme="light"] .fortune-display {
            background: rgba(99, 102, 241, 0.06);
        }

        .fortune-display.active {
            border-style: solid;
            border-color: var(--accent-cyan);
            box-shadow: inset 0 0 15px rgba(77, 238, 234, 0.15);
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Footer */
        footer {
            text-align: center;
            color: var(--text-sub);
            font-size: 0.9rem;
            margin-top: 1rem;
            padding-top: 1.5rem;
            border-top: 1px solid var(--card-border);
        }

        /* Responsive Mobile Settings */
        @media (max-width: 600px) {
            .hero h1 { font-size: 1.7rem; }
            .hero p { font-size: 0.95rem; }
            .section-title { font-size: 1.3rem; }
            .ox-btn { width: 65px; height: 65px; font-size: 1.7rem; }
            .container { padding: 1rem 0.8rem 3rem 0.8rem; gap: 1.8rem; }
            .hero { padding: 2rem 1rem; }
            .cards-grid { grid-template-columns: 1fr; }
            .flip-card { height: 190px; }
        }
    </style>

<body data-theme="dark">

<script data-studio="js">
(function () {
    function each(sel, fn) { Array.prototype.forEach.call(document.querySelectorAll(sel), fn); }
    each('[data-st="tabs"]', function (t) {
      var bs = t.querySelectorAll('.st-tab'), ps = t.querySelectorAll('.st-tab-panel');
      function show(i) { bs.forEach(function (b, k) { b.classList.toggle('is-on', k === i); b.setAttribute('aria-selected', k === i); }); ps.forEach(function (p, k) { p.hidden = k !== i; }); }
      bs.forEach(function (b, i) { b.addEventListener('click', function () { show(i); }); });
      show(0);
    });
    each('[data-st-open]', function (b) { b.addEventListener('click', function () { var d = document.getElementById(b.getAttribute('data-st-open')); if (d && d.showModal) d.showModal(); }); });
    each('dialog.st-modal', function (d) { d.addEventListener('click', function (e) { if (e.target === d || e.target.closest('[data-st-close]')) d.close(); }); });
    each('[data-st="slider"]', function (s) {
      var tr = s.querySelector('.st-slides'), dots = s.querySelector('.st-dots'), i = 0, n = tr.children.length;
      function paint() { if (dots) Array.prototype.forEach.call(dots.children, function (d, k) { d.classList.toggle('is-on', k === i); }); }
      function go(k) { i = (k + n) % n; tr.scrollTo({ left: tr.clientWidth * i, behavior: 'smooth' }); paint(); }
      if (dots) { dots.innerHTML = ''; for (var k = 0; k < n; k++) (function (k) { var d = document.createElement('button'); d.type = 'button'; d.setAttribute('aria-label', (k + 1) + '번째 사진'); d.addEventListener('click', function () { go(k); }); dots.appendChild(d); })(k); }
      var pv = s.querySelector('.st-prev'), nx = s.querySelector('.st-next');
      if (pv) pv.addEventListener('click', function () { go(i - 1); });
      if (nx) nx.addEventListener('click', function () { go(i + 1); });
      tr.addEventListener('scroll', function () { var k = Math.round(tr.scrollLeft / (tr.clientWidth || 1)); if (k !== i) { i = k; paint(); } });
      paint();
    });
    each('[data-st="quiz"]', function (q) {
      var r = q.querySelector('.st-qr'), os = q.querySelectorAll('.st-opt');
      os.forEach(function (o) { o.addEventListener('click', function () { var ok = o.hasAttribute('data-ok'); os.forEach(function (x) { x.classList.remove('is-ok', 'is-no'); }); o.classList.add(ok ? 'is-ok' : 'is-no'); if (r) r.textContent = ok ? (q.getAttribute('data-ok-msg') || '정답이에요!') : (q.getAttribute('data-no-msg') || '다시 생각해 봐요.'); }); });
    });
    each('[data-st="check"]', function (c, ci) {
      var bs = c.querySelectorAll('input[type=checkbox]'), out = c.querySelector('.st-cnt'), bar = c.querySelector('.st-bar i'), key = 'st-check-' + location.pathname + '-' + ci, sv = {};
      try { sv = JSON.parse(localStorage.getItem(key) || '{}') || {}; } catch (e) {}
      function up() { var d = 0; bs.forEach(function (b) { if (b.checked) d++; }); if (out) out.textContent = d + ' / ' + bs.length + ' 완료'; if (bar) bar.style.width = (bs.length ? d / bs.length * 100 : 0) + '%'; }
      bs.forEach(function (b, i) { b.checked = !!sv[i]; b.addEventListener('change', function () { sv[i] = b.checked; try { localStorage.setItem(key, JSON.stringify(sv)); } catch (e) {} up(); }); });
      up();
    });
    each('[data-st="dday"]', function (e) {
      var o = e.querySelector('.st-dnum'), t = new Date(e.getAttribute('data-date') + 'T00:00:00'), now = new Date(); now.setHours(0, 0, 0, 0);
      var d = Math.round((t - now) / 864e5); if (o) o.textContent = isNaN(d) ? '날짜를 정해요' : d > 0 ? 'D-' + d : d === 0 ? 'D-DAY' : 'D+' + (-d);
    });
    each('[data-st="timer"]', function (e) {
      var m = +e.getAttribute('data-min') || 25, left = m * 60, id = 0, o = e.querySelector('.st-tnum'), go = e.querySelector('.st-tgo'), rs = e.querySelector('.st-trs');
      function p() { o.textContent = String(Math.floor(left / 60)).padStart(2, '0') + ':' + String(left % 60).padStart(2, '0'); }
      function stop() { clearInterval(id); id = 0; go.textContent = '시작'; }
      go.addEventListener('click', function () { if (id) { stop(); return; } o.classList.remove('is-done'); id = setInterval(function () { if (left > 0) { left--; p(); } if (left <= 0) { stop(); o.classList.add('is-done'); } }, 1000); go.textContent = '잠시 멈춤'; });
      rs.addEventListener('click', function () { stop(); left = m * 60; o.classList.remove('is-done'); p(); });
      p();
    });
    each('[data-st="dark"]', function (b) {
      try { if (localStorage.getItem('st-dark') === '1') document.documentElement.classList.add('st-dark'); } catch (e) {}
      b.addEventListener('click', function () { var on = document.documentElement.classList.toggle('st-dark'); try { localStorage.setItem('st-dark', on ? '1' : '0'); } catch (e) {} });
    });
    // 스크롤 등장 효과: 화면에 들어오면 나타남 (지원하지 않는 브라우저·움직임 줄이기 설정에서는 그냥 보임)
    var ins = document.querySelectorAll('[data-st-in]');
    if (ins.length && 'IntersectionObserver' in window && !(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches)) {
      document.documentElement.classList.add('st-js');
      var io = new IntersectionObserver(function (es) { es.forEach(function (e) { if (e.isIntersecting) { e.target.classList.add('is-in'); io.unobserve(e.target); } }); }, { threshold: 0.08 });
      Array.prototype.forEach.call(ins, function (e) { io.observe(e); });
    }
  })();
</script>
